<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
         {{ title }}
        {% endblock %}
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
        }

        header {
            background: #111827;
            padding: 1rem 2rem;
        }

        nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 2rem;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        button {
            padding: .7rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .messages {
            margin-bottom: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: .5rem;
        }

        .success {
            background: #dcfce7;
        }

        .error {
            background: #fee2e2;
        }

    </style>

</head>

<body>

<header>
    {% if user.is_authenticated %}
        <nav>

            <a href="{% url 'items:found_items' %}">
                Itens Encontrados
            </a>

            <a href="{% url 'items:donation_items' %}">
                Itens para Doação
            </a>

            <a href="#">
                Minhas Reivindicações
            </a>

            <a href="{% url 'items:my_items' %}">
                Meus Cadastros
            </a>

            <a href="#">
                Itens Manifestados
            </a>

            <a href="{% url 'items:create' %}">
                Cadastrar Item
            </a>

            <a href="{% url 'logout' %}">Sair</a>
        </nav>
    {% endif %}

</header>

<main>

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
