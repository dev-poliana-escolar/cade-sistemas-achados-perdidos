{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        Editar Item
    </h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="primary"
        >
            Atualizar
        </button>

    </form>

</div>

{% endblock %}
