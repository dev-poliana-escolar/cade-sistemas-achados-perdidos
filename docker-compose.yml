services:
  db:
    image: postgres:16
    container_name: cade_db
    environment:
      POSTGRES_DB: cade_db
      POSTGRES_USER: cade_user
      POSTGRES_PASSWORD: cade234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./backend
    container_name: cade_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: