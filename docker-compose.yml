services:
  db:
    image: postgres:16
    container_name: cade_db
    environment:
      POSTGRES_DB: cade_db
      POSTGRES_USER: cade_user
      POSTGRES_PASSWORD: cade234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cade_user -d cade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cade_web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # Garante que o banco está 100% pronto para aceitar conexões

volumes:
  postgres_data: