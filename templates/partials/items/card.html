<div class="card mb-3">
    <div class="card-body">

        <h5>{{ reporte.item.categoria }}</h5>

        <p>
            <strong>Cor:</strong>
            {{ reporte.item.cor }}
        </p>

        <p>
            <strong>Local onde foi encontrado:</strong>
            {{ reporte.local }}
        </p>

        <div class="alert alert-secondary mb-0">
            A descrição detalhada e a fotografia não são exibidas para proteger
            a identificação do verdadeiro proprietário. Caso este item possa ser
            seu, procure a COAPAC para realizar a identificação.
        </div>

    </div>
</div>
